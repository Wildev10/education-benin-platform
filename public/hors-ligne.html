<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="robots" content="noindex">
  <title>Hors ligne — EduTech Bénin</title>
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: #FAFAFA; color: #0A0A0A;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header { background: #0A0A0A; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
    header img { width: 44px; height: 44px; border-radius: 12px; background: #fff; padding: 4px; }
    header p { margin: 0; color: #fff; font-size: 14px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    .carte {
      max-width: 440px; width: 100%; text-align: center; background: #fff;
      border: 1px solid #E5E5E5; border-radius: 16px; padding: 32px 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    .pastille {
      width: 56px; height: 56px; margin: 0 auto; border-radius: 50%;
      background: #FFF7ED; color: #C2410C; display: flex; align-items: center; justify-content: center;
    }
    h1 { margin: 20px 0 0; font-size: 22px; }
    p.texte { margin: 12px 0 0; color: #404040; line-height: 1.6; }
    .actions { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    button {
      font: inherit; font-weight: 600; font-size: 14px; border-radius: 8px; padding: 10px 18px; cursor: pointer;
    }
    .principal { background: #F97316; color: #0A0A0A; border: 0; }
    .principal:hover { background: #C2410C; color: #fff; }
    .secondaire { background: #fff; color: #404040; border: 1px solid #E5E5E5; }
    button:focus-visible { outline: 2px solid #C2410C; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <img src="/icons/icon-192.png" alt="" width="44" height="44">
    <p>EduTech Bénin</p>
  </header>
  <main>
    <div class="carte" role="alert">
      <div class="pastille" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M19 12.9a10 10 0 0 0-2.3-1.7"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M22 8.8a15 15 0 0 0-11.3-3.8"/><path d="M12 20h.01"/>
        </svg>
      </div>
      <h1>Vous êtes hors ligne</h1>
      <p class="texte">
        Cette page n'a pas encore été consultée sur cet appareil, elle n'est donc pas disponible sans connexion.
        Les pages déjà visitées restent consultables.
      </p>
      <div class="actions">
        <button type="button" class="principal" onclick="location.reload()">Réessayer</button>
        <button type="button" class="secondaire" onclick="history.back()">Page précédente</button>
      </div>
    </div>
  </main>
</body>
</html>
